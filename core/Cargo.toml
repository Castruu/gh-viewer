[package]
name = "ghv_core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
# staticlib is linked into the Swift app; cdylib is only used by uniffi-bindgen to read metadata.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
agent-client-protocol = { version = "5.6.0", features = ["process"] }
getrandom = "0.4"
http-body-util = "0.1"
humantime = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.13", features = ["json"] }
rmcp = { version = "3.11", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "rt-multi-thread", "sync", "fs", "macros"] }
uniffi = { version = "0.32", features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
